<!doctype html>
<!--
  Página de error 404: GitHub Pages la enseña cuando alguien entra en
  una dirección de sernuu.com que no existe. Las rutas empiezan por "/"
  para que funcionen desde cualquier subcarpeta.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · sernuu</title>
<meta name="description" content="Esta página no existe.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF7A18'/%3E%3Cstop offset='1' stop-color='%23A855FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-weight='700' font-size='40' text-anchor='middle' fill='white'%3Es%3C/text%3E%3C/svg%3E">
<!-- La letra se sirve desde esta misma web (no desde Google) -->
<link rel="stylesheet" href="/fonts/space-grotesk.css">
<style>
  :root { --bg: #07070B; --surface: #111118; --border: #262633; --text: #F4F4F8; --dim: #A0A0B4; --mute: #62627A; --neon: #39FF14; --orange: #FF7A18; --violet: #A855FF; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  header { border-bottom: 1px solid var(--border); }
  header .wrap { display: flex; align-items: center; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 700; font-size: 20px; }
  .mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--orange), var(--violet)); }
  main { padding: 40px 0 60px; }
  h1 { font-size: 40px; line-height: 1.1; letter-spacing: -1px; margin: 0 0 10px; }
  .date { color: var(--mute); margin: 0 0 30px; }
  h2 { font-size: 21px; margin: 34px 0 8px; }
  p, li { color: var(--dim); }
  strong { color: var(--text); font-weight: 500; }
  a { color: var(--neon); }
  footer { border-top: 1px solid var(--border); padding: 24px 0 40px; color: var(--mute); font-size: 14px; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/"><span class="mark">s</span>sernuu</a></div></header>
<main class="wrap">
  <h1>Esta página no existe</h1>
  <p>Puede que el enlace esté mal escrito o que la página ya no esté.</p>
  <p><a href="/">Ir a sernuu.com</a> · <a href="https://rumbo.sernuu.com/app/">Abrir Rumbo</a></p>
</main>
<footer><div class="wrap"><a href="/">← Volver a sernuu.com</a></div></footer>
</body>
</html>
